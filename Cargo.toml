[package]
name = "ollama-shepherd"
version = "0.2.0"
edition = "2021"
description = "TUI dashboard for Ollama Cloud subscription usage across multiple API keys"
authors = ["Gianni"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-piechart = "=0.2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
chrono = "0.4"

[profile.release]
strip = true
lto = "thin"